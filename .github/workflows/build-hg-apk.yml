name: Build Hg Keyboard APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Loại build: debug hoặc release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: build-hg-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "5"

jobs:
  build-apk:
    name: Build Android APK (Hg)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platforms/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK & NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-37.0" "ndk;29.0.14206865"

      - name: Add Rust Android Targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build APK (Debug / Release)
        env:
          BUILD_TYPE: ${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'release') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0-dev"
          fi
          echo "Building Hg Keyboard version: $VERSION with type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :app:assembleDebug --console=plain "-Pfunput.versionName=$VERSION"
            cp app/build/outputs/apk/debug/app-debug.apk ../../Hg-Keyboard-debug.apk
          else
            ./gradlew :app:assembleRelease --console=plain "-Pfunput.versionName=$VERSION" || ./gradlew :app:assembleDebug --console=plain "-Pfunput.versionName=$VERSION"
            if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
              cp app/build/outputs/apk/release/app-release-unsigned.apk ../../Hg-Keyboard-$VERSION.apk
            elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
              cp app/build/outputs/apk/release/app-release.apk ../../Hg-Keyboard-$VERSION.apk
            else
              cp app/build/outputs/apk/debug/app-debug.apk ../../Hg-Keyboard-$VERSION.apk
            fi
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hg-Keyboard-APK
          path: Hg-Keyboard-*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (Khi gắn Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Hg-Keyboard-*.apk
          name: "Hg Keyboard ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
